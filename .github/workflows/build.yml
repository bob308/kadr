name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log

      # When the build fails, keep the log on the ci-log branch so it can be read back.
      - name: Save build log
        if: failure()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          git add -f build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin ci-log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Kadr.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Кадр, збірка ${{ github.run_number }}
          body: Відкрийте цю сторінку на телефоні й натисніть Kadr.apk, щоб завантажити.
          files: Kadr.apk
          make_latest: true
